<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Card Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

:root{
  --ink:#18120f;
  --ink-soft:#5c554e;
  --paper:#ffffff;
  --paper-soft:#faf7f2;
  --page:#efe9df;
  --line:#e7ded0;
  --red:#e1002b;
  --red-dark:#a5081f;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #f6efe1 0%, transparent 60%),
    var(--page);
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  color:var(--ink);
  padding:32px 16px 80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  overflow-x:hidden;
}

.page-title{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:26px;
  margin-bottom:4px;
  text-align:center;
}
.page-sub{
  color:var(--ink-soft);
  font-size:14px;
  margin-bottom:28px;
  text-align:center;
  max-width:480px;
}

/* ---------- INPUT PANEL ---------- */
.input-panel{
  max-width:640px;
  width:100%;
  background:var(--paper);
  border-radius:18px;
  box-shadow:0 20px 40px -20px rgba(24,18,15,.2);
  padding:22px 26px;
  margin-bottom:22px;
}
.input-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:10px;
  display:block;
}
textarea#promptInput{
  width:100%;
  min-height:140px;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:14px 16px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  line-height:1.6;
  color:var(--ink);
  resize:vertical;
  outline:none;
  transition:border-color .2s ease;
}
textarea#promptInput:focus{border-color:var(--red)}

.input-row{
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}
.title-input{
  flex:1;
  min-width:160px;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  outline:none;
}
.title-input:focus{border-color:var(--red)}

.btn-primary{
  background:var(--ink);
  color:var(--paper);
  border:none;
  font-weight:700;
  font-size:13px;
  padding:11px 20px;
  border-radius:30px;
  cursor:pointer;
  transition:background .15s ease, transform .15s ease;
}
.btn-primary:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0) scale(.97)}

.btn-secondary{
  background:var(--paper);
  color:var(--ink);
  border:1.5px solid var(--line);
  font-weight:700;
  font-size:13px;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  transition:border-color .15s ease, transform .15s ease;
}
.btn-secondary:hover{border-color:var(--ink);transform:translateY(-1px)}

/* ---------- PREVIEW CARD (same design as fixed template) ---------- */
.prompt-wrapper{
  max-width:640px;
  width:100%;
  background:var(--paper);
  border-radius:18px;
  box-shadow:0 30px 60px -20px rgba(24,18,15,.25), 0 1px 0 rgba(24,18,15,.04);
  position:relative;
  overflow:hidden;
}
.accent-bar{
  height:4px;
  background:linear-gradient(90deg,var(--red),#f2b24a,var(--red-dark),var(--red));
  background-size:300% 100%;
  animation:sweep 6s linear infinite;
}
@keyframes sweep{0%{background-position:0% 0}100%{background-position:300% 0}}

.prompt-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:22px 26px 20px;border-bottom:1px solid var(--line);
}
.eyebrow{font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--ink);line-height:1.25}
.eyebrow .tag{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:6px;
}
.eyebrow .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red)}

.copy-btn{
  flex-shrink:0;background:var(--ink);border:none;color:var(--paper);font-size:13px;font-weight:700;
  padding:11px 18px;border-radius:30px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:transform .15s ease, background .15s ease;
}
.copy-btn:hover{background:var(--red-dark);transform:translateY(-2px)}
.copy-btn:active{transform:translateY(0) scale(.96)}
.copy-btn svg{width:15px;height:15px;flex-shrink:0}
.copy-btn.copied{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

pre#previewText{
  padding:26px;margin:0;font-family:'SF Mono',Monaco,'Cascadia Code',ui-monospace,monospace;
  font-size:14px;line-height:1.7;white-space:pre-wrap;background:var(--paper-soft);
  color:#3a352f;max-height:360px;overflow-y:auto;
}

.buttons-section{padding:20px 26px 26px;border-top:1px solid var(--line)}
.buttons-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
.button-container{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ai-button{
  position:relative;padding:13px 16px;border:1.5px solid var(--line);background:var(--paper);
  border-radius:13px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:border-color .2s ease, transform .2s ease;
}
.ai-button:active{transform:scale(.97)}
.chip{width:26px;height:26px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center}
.chip svg{width:15px;height:15px}
.chatgpt-button .chip{background:#10a37f}
.chatgpt-button .chip svg{fill:#fff}
.chatgpt-button:hover{border-color:#10a37f;background:rgba(16,163,127,.06);transform:translateY(-2px)}
.gemini-button .chip{background:#5b5bd6}
.gemini-button .chip svg{fill:#fff}
.gemini-button:hover{border-color:#5b5bd6;background:rgba(91,91,214,.06);transform:translateY(-2px)}
.ai-button.loading{pointer-events:none;opacity:.6}
.ai-button.loading .chip svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{
  position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);
  padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;
  transform:translateY(16px);transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 14px 30px rgba(24,18,15,.3);z-index:100;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0)}

.empty-hint{color:var(--ink-soft);font-size:13px;font-style:italic}

@media (max-width:560px){
  .prompt-header{padding:18px 18px 16px}
  pre#previewText{padding:20px 18px;font-size:13.5px}
  .buttons-section{padding:16px 18px 24px}
  .button-container{grid-template-columns:1fr}
  .input-panel{padding:18px}
}
</style>
</head>
<body>

<div class="page-title">Prompt Card Generator</div>
<div class="page-sub">Paste any prompt below. The card updates live, and you can download it as a ready-to-use HTML file.</div>

<div class="input-panel">
  <label class="input-label" for="promptInput">Your prompt</label>
  <textarea id="promptInput" placeholder="Paste or type your prompt here...">A cozy reading nook by a rain-streaked window, warm lamp light, an open book on a knitted blanket, steam rising from a mug of tea, soft cinematic lighting, ultra-detailed illustration.</textarea>

  <div class="input-row">
    <input type="text" id="titleInput" class="title-input" placeholder="Card title (optional)" value="AI Image Prompt">
    <button class="btn-primary" id="updateBtn" type="button">Update Preview</button>
    <button class="btn-secondary" id="copyCodeBtn" type="button">Copy Full Code</button>
  </div>
</div>

<div class="prompt-wrapper">
  <div class="accent-bar"></div>
  <div class="prompt-header">
    <div>
      <div class="eyebrow"><span class="tag" id="cardTagLabel">AI Image Prompt</span><br>Copy &amp; use anywhere</div>
    </div>
    <button class="copy-btn" id="copyBtn" type="button" title="Copy to clipboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
      <span class="copy-label">Copy</span>
    </button>
  </div>

  <pre id="previewText"></pre>

  <div class="buttons-section">
    <div class="buttons-title">Try this prompt with</div>
    <div class="button-container">
      <button class="ai-button chatgpt-button" id="chatgptBtn" type="button">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></svg></span>
        ChatGPT
      </button>
      <button class="ai-button gemini-button" id="geminiBtn" type="button">
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2zm0 3a1 1 0 0 0-1 1v4.586l-3.293-3.293a1 1 0 0 0-1.414 1.414L9.586 12l-3.293 3.293a1 1 0 1 0 1.414 1.414L11 13.414V18a1 1 0 1 0 2 0v-4.586l3.293 3.293a1 1 0 0 0 1.414-1.414L14.414 12l3.293-3.293a1 1 0 0 0-1.414-1.414L13 10.586V6a1 1 0 0 0-1-1z"/></svg></span>
        Gemini
      </button>
    </div>
  </div>
</div>

<div id="toast">Prompt copied to clipboard! 🎉</div>

<script>
(function () {
  const promptInput = document.getElementById("promptInput");
  const titleInput  = document.getElementById("titleInput");
  const previewText = document.getElementById("previewText");
  const cardTagLabel= document.getElementById("cardTagLabel");
  const updateBtn   = document.getElementById("updateBtn");
  const copyCodeBtn = document.getElementById("copyCodeBtn");
  const copyBtn     = document.getElementById("copyBtn");
  const chatgptBtn  = document.getElementById("chatgptBtn");
  const geminiBtn   = document.getElementById("geminiBtn");
  const toast       = document.getElementById("toast");
  let toastTimer = null;

  function refreshPreview() {
    previewText.textContent = promptInput.value || "Type a prompt above to see it here.";
    cardTagLabel.textContent = titleInput.value || "AI Image Prompt";
  }
  refreshPreview();
  updateBtn.addEventListener("click", refreshPreview);
  promptInput.addEventListener("input", refreshPreview);
  titleInput.addEventListener("input", refreshPreview);

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
    }
    return Promise.resolve(legacyCopy(text));
  }

  function legacyCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  copyBtn.addEventListener("click", function () {
    copyToClipboard(previewText.textContent).then(() => {
      showToast("Prompt copied! 🎉");
      const original = copyBtn.innerHTML;
      copyBtn.innerHTML = "✅ Copied";
      copyBtn.classList.add("copied");
      setTimeout(() => { copyBtn.innerHTML = original; copyBtn.classList.remove("copied"); }, 1500);
    });
  });

  const AI_SITES = {
    chatgpt: "https://chat.openai.com/",
    gemini:  "https://gemini.google.com/app"
  };
  const TOAST_MSGS = {
    chatgpt: "Prompt copied! Opening ChatGPT… 🤖",
    gemini:  "Prompt copied! Opening Gemini… ✨"
  };

  function openAI(platform, button) {
    button.classList.add("loading");
    copyToClipboard(previewText.textContent).then(() => {
      showToast(TOAST_MSGS[platform]);
      window.open(AI_SITES[platform], "_blank", "noopener");
    });
    setTimeout(() => button.classList.remove("loading"), 600);
  }
  chatgptBtn.addEventListener("click", function () { openAI("chatgpt", chatgptBtn); });
  geminiBtn.addEventListener("click", function () { openAI("gemini", geminiBtn); });

  // ---------- Download standalone HTML with the current prompt baked in ----------
  function buildStandaloneHTML(promptText, cardTitle) {
    const safePrompt = promptText
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    const safeTitle = (cardTitle || "AI Image Prompt")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${safeTitle}</title>
<style>

@keyframes sweep{0%{background-position:0% 0}100%{background-position:300% 0}}

.eyebrow{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.25}
.eyebrow .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.eyebrow .tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red)}
.copy-btn{background:var(--ink);border:none;color:var(--paper);font-size:13px;font-weight:700;padding:11px 18px;border-radius:30px;cursor:pointer;display:flex;align-items:center;gap:7px}

.chip{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.chip svg{width:15px;height:15px}
.chatgpt-button .chip{background:#10a37f}
.chatgpt-button .chip svg{fill:#fff}
.chatgpt-button:hover{border-color:#10a37f}
.gemini-button .chip{background:#5b5bd6}
.gemini-button .chip svg{fill:#fff}
.gemini-button:hover{border-color:#5b5bd6}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;opacity:0;transform:translateY(16px);transition:all .3s ease;z-index:100}

</style>
</head>
<body>
<div class="prompt-wrapper">
  <div class="accent-bar"></div>
  <div class="prompt-header">
    <div><div class="eyebrow"><span class="tag">${safeTitle}</span><br>Copy &amp; use anywhere</div></div>
    <button class="copy-btn" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>

  <div class="buttons-section">

        ChatGPT
